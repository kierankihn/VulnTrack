name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.repository }}
          path: '.'
          format: 'JSON'
          out: 'dependency-check-report'
          args: >
            --enableRetired
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Push Results to VulnTrack
        if: always()
        env:
          VULNTRACK_URL: ${{ secrets.VULNTRACK_URL }}
          VULNTRACK_API_KEY: ${{ secrets.VULNTRACK_API_KEY }}
          PROJECT_NAME: ${{ github.repository }}
        run: |
          PAYLOAD=$(jq --arg project "$PROJECT_NAME" --arg repo "${{ github.server_url }}/${{ github.repository }}" '{
            projectName: $project,
            repoUrl: $repo,
            dependencies: [
              .dependencies[]
              | select(.vulnerabilities != null and (.vulnerabilities | length) > 0)
              | {
                  fileName: .fileName,
                  vulnerabilities: [
                    .vulnerabilities[]
                    | select(.name | startswith("CVE-"))
                    | {
                        name: .name,
                        severity: .severity,
                        cvssScore: (.cvssv3.baseScore // .cvssv2.score // 0),
                        description: .description
                      }
                  ]
                }
            ]
          }' dependency-check-report/dependency-check-report.json)

          curl -sf -X POST "$VULNTRACK_URL/api/v1/external/scan" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $VULNTRACK_API_KEY" \
            -d "$PAYLOAD" | jq '.ticketsCreated'
