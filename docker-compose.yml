services:
  postgres:
    image: postgres:16-alpine
    container_name: vulntrack-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulntrack}
      POSTGRES_USER: ${POSTGRES_USER:-vulntrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulntrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: vulntrack-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vulntrack}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vulntrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}

  frontend:
    build: ./frontend
    container_name: vulntrack-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
